# World Sync: Jormungandr - monsters the server doesn't have yet.
#
# 21981 MD_EP20_BOSS_LASGAND is the official id the client draws as the
# undying bishop (its sprite and name are in the client's tables; rAthena
# only has a commented-out placeholder for it). Its stats aren't published:
# these follow the Snowstorm Angel, the other Episode 20 boss, so the
# memorial dungeon fits the level 200-250 players the episode is for.
#
# 22371 EP21_YOR_TAN (Eroded Tan), Episode 21's last battle: the client knows
# it, rAthena has no entry. Stats follow the Yortus of Gimle, the episode's
# strongest field monsters.
#
# 22369/22370, the drowned crew and captain of the ghost ship (1@wtgs): known to
# the client, not to rAthena. Stats follow the ship's place in the story: a
# crew below the Yortus, a captain a little below the Eroded Tan.
